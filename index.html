<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172033"><title>WFM</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="WFM">
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;margin:0;background:#f3f5f8;color:#202938}header{background:#172033;color:white;padding:16px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left));position:sticky;top:0;z-index:2;box-shadow:0 2px 8px #0002}header h1{font-size:21px;margin:0 0 5px}header .sub{font-size:12px;color:#cbd5e1}main{max-width:900px;margin:16px auto;padding:0 12px 30px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0000000b}.login{max-width:420px;margin:60px auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;min-width:0;font-size:13px;font-weight:700}input{display:block;min-width:0;max-width:100%;width:100%;padding:12px;margin-top:6px;border:1px solid #cbd2de;border-radius:9px;font-size:16px;background:#fff;color:#202938}input[type="date"]{width:100%;min-width:0;max-width:100%;appearance:none;-webkit-appearance:none} .grid>label{min-width:0;overflow:hidden} input.invalid{border:2px solid #dc2626!important;background:#fff1f2!important;box-shadow:0 0 0 2px #fecaca!important}input:focus{outline:2px solid #93c5fd;outline-offset:1px}input.invalid:focus{outline-color:#dc2626}button{padding:12px 14px;border:0;border-radius:9px;background:#315efb;color:white;font-weight:700;font-size:15px;margin:5px 5px 0 0;cursor:pointer}.secondary{background:#e5e9f0;color:#263244}.danger{background:#fee2e2;color:#991b1b}.hidden{display:none!important}.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1;margin:0}.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric{background:#f5f7fa;padding:12px;border-radius:9px;font-size:12px;color:#586174}.metric strong{display:block;font-size:22px;color:#172033;margin-top:5px;overflow-wrap:anywhere}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px;font-size:12px}td,th{padding:9px;border-bottom:1px solid #e4e7ec;white-space:nowrap;text-align:right}td:first-child,th:first-child{text-align:left}th{background:#f5f6f8}.note{font-size:12px;color:#667085;line-height:1.6}.badge{background:#e8efff;color:#315efb;padding:4px 8px;border-radius:20px;font-size:12px}.section-title{margin:0 0 14px;font-size:18px}.form-actions{display:flex;flex-wrap:wrap;margin-top:14px}.amount input{font-variant-numeric:tabular-nums}.errors{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;padding:12px;border-radius:10px;margin-top:14px}.errors.ok{background:#ecfdf3;border-color:#a7f3d0;color:#166534}.errors ul{margin:8px 0 0;padding-left:20px}.errors li{margin:5px 0;line-height:1.5}.error-detail{font-weight:700}.errors .hint{font-size:12px;margin-top:8px}.error-cell{white-space:normal!important;text-align:left!important;min-width:240px;max-width:340px;color:#9f1239}.error-cell .oktext{color:#15803d}.editbtn{background:#e0f2fe;color:#075985}@media(min-width:650px){.summary{grid-template-columns:repeat(4,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:360px){.grid{grid-template-columns:1fr}header h1{font-size:19px}}
</style>
<script>if('serviceWorker'in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(e=>console.log('SW registration failed',e)));}</script>
</head><body>
<div id="login" class="card login"><h1 style="text-align:center">WFM</h1><p>社員番号を入力してログイン</p><label>社員番号<input id="empId" inputmode="numeric" placeholder="例：10001" onkeydown="if(event.key==='Enter')loginUser()"></label><button style="width:100%;margin-top:15px" onclick="loginUser()">ログイン</button><p class="note">※社員番号による簡易ログインです。</p></div>
<div id="app" class="hidden"><header><button style="float:right;background:#374151;padding:8px 10px;margin:0" onclick="logout()">ログアウト</button><h1>WFM</h1><div id="user" class="sub"></div></header><main><div class="tabs"><button onclick="tab('my')">記録一覧</button><button onclick="tab('input')">＋ 実績入力</button></div>
<section id="input" class="card hidden"><h2 class="section-title">配送実績入力</h2><div class="grid"><label>日付<input id="date" type="date" required></label><label>配送件数<input id="deliveryCount" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label><label>個配件数<input id="kohaCount" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label><label>ペア個配件数<input id="pairKohaCount" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label><label>実配件数<input id="actualCount" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label><label>新規件数<input id="newCount" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label><label>班件数<input id="teamCount" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label><label>班配布枚数<input id="teamSheets" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label><label class="amount">供給金額（円）<input id="supplyAmount" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label></div><div id="validation" class="errors ok" aria-live="polite">数値を入力すると、エラーを確認できます。</div><div class="form-actions"><button id="saveButton" onclick="addRecord()">記録を保存</button><button class="secondary" onclick="clearForm()">入力をクリア</button></div></section>
<section id="my" class="card"><h2 class="section-title">記録一覧</h2><div id="mySummary" class="summary"></div><div class="tablewrap" style="margin-top:14px"><table><thead><tr><th>日付</th><th>配送件数</th><th>個配件数</th><th>ペア個配件数</th><th>実配件数</th><th>新規件数</th><th>班件数</th><th>班配布枚数</th><th>供給金額</th><th>エラー確認</th><th>操作</th></tr></thead><tbody id="myRows"></tbody></table></div><p id="myEmpty" class="note">まだ記録がありません。</p></section>
</main></div>
<script>
const STORAGE_KEY='deliveryWfmRecords';
const fields=['deliveryCount','kohaCount','pairKohaCount','actualCount','newCount','teamCount','teamSheets','supplyAmount'];
const labels={deliveryCount:'配送件数',kohaCount:'個配件数',pairKohaCount:'ペア個配件数',actualCount:'実配件数',newCount:'新規件数',teamCount:'班件数',teamSheets:'班配布枚数',supplyAmount:'供給金額'};
let records=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'),employee='',editingId=null;
records.forEach(r=>{if(!r.id)r.id=makeId()});
function makeId(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(36).slice(2)}
function loginUser(){employee=document.getElementById('empId').value.trim();if(!employee)return alert('社員番号を入力してください');sessionStorage.setItem('wfmEmployee',employee);start()}
function start(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('user').innerHTML='ログイン中：<span class="badge">社員番号 '+esc(employee)+'</span>';document.getElementById('date').value=localDate();tab('my');save()}
function logout(){sessionStorage.removeItem('wfmEmployee');location.reload()}
function tab(t){['input','my'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==t));if(t==='my')renderMy();if(t==='input')validateForm()}
function localDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function num(id){return Math.max(0,Number(document.getElementById(id).value)||0)}
function valuesFromForm(){const v={};fields.forEach(k=>v[k]=num(k));return v}
function getErrors(r){
 const e=[],delivery=Number(r.deliveryCount)||0,koha=Number(r.kohaCount)||0,pair=Number(r.pairKohaCount)||0,actual=Number(r.actualCount)||0,newc=Number(r.newCount)||0,sheets=Number(r.teamSheets)||0;
 const sum2=koha+pair*2, sum3=koha+sheets+pair*2;
 const mismatch=(sum)=>{const diff=sum-delivery;return diff>0?`${diff}件多い`:diff<0?`${Math.abs(diff)}件不足`:'一致'};
 if(actual>delivery)e.push({code:1,fields:['actualCount','deliveryCount'],message:`① 実配件数 ${actual}件 が配送件数 ${delivery}件 を超えています（${actual-delivery}件超過）。`});
 if(sum2!==delivery)e.push({code:2,fields:['kohaCount','pairKohaCount','deliveryCount'],message:`② 個配件数 ${koha}件 ＋ ペア個配件数 ${pair}件 × 2 ＝ ${sum2}件。配送件数は ${delivery}件のため、${mismatch(sum2)}です。`});
 if(sum3!==delivery)e.push({code:3,fields:['kohaCount','teamSheets','pairKohaCount','deliveryCount'],message:`③ 個配件数 ${koha}件 ＋ 班配布枚数 ${sheets}枚 ＋ ペア個配件数 ${pair}件 × 2 ＝ ${sum3}件。配送件数は ${delivery}件のため、${mismatch(sum3)}です。`});
 // 新規件数を含めると②または③の内訳が配送件数に一致する場合、④の可能性を表示
 const sum2WithNew=sum2+newc, sum3WithNew=sum3+newc;
 if(newc>0 && ((sum2WithNew===delivery && sum2!==delivery)||(sum3WithNew===delivery && sum3!==delivery))){
   const cases=[]; if(sum2WithNew===delivery&&sum2!==delivery)cases.push(`②の内訳 ${sum2}件 ＋ 新規件数 ${newc}件 ＝ ${sum2WithNew}件`); if(sum3WithNew===delivery&&sum3!==delivery)cases.push(`③の内訳 ${sum3}件 ＋ 新規件数 ${newc}件 ＝ ${sum3WithNew}件`);
   e.push({code:4,fields:['newCount','deliveryCount','kohaCount','pairKohaCount','teamSheets'],message:`④ 新規件数の計上方法を確認してください。${cases.join('／')}となり、配送件数 ${delivery}件と一致します。新規件数の扱いが内訳に反映されていない可能性があります。`});
 }
 return e;
}
function validateForm(){
 const box=document.getElementById('validation');if(!box)return;
 // 全項目（日時＋8つの数値）が入力されるまでは、エラー表示も赤枠も出さない
 fields.concat(['deliveryCount']).forEach(k=>document.getElementById(k).classList.remove('invalid'));
 const allComplete=!!document.getElementById('date').value && fields.every(k=>document.getElementById(k).value.trim()!=='');
 if(!allComplete){
   box.classList.add('ok');
   box.innerHTML='<strong>入力待ち</strong><div class="note">日付とすべての数値を入力すると、入力内容をチェックします。</div>';
   return;
 }
 const r={...valuesFromForm()},errs=getErrors(r);
 const bad=new Set(errs.flatMap(x=>x.fields));bad.forEach(k=>{const el=document.getElementById(k);if(el)el.classList.add('invalid')});
 box.classList.toggle('ok',errs.length===0);
 box.innerHTML=errs.length?'<strong>入力エラーがあります（赤枠の項目を確認してください）</strong><ul>'+errs.map(x=>'<li><span class="error-detail">'+esc(x.message)+'</span></li>').join('')+'</ul><div class="hint">各エラーには、入力値・計算結果・配送件数との差を表示しています。</div>':'<strong>エラーはありません</strong><div class="note">すべての項目が入力され、設定されたチェック条件を満たしています。</div>';
}
function addRecord(){const date=document.getElementById('date').value;if(!date)return alert('日付を入力してください');const wasEditing=!!editingId;const r={...valuesFromForm(),id:editingId||makeId(),employee,date,createdAt:new Date().toISOString()};if(editingId){const ix=records.findIndex(x=>x.id===editingId&&String(x.employee)===String(employee));if(ix<0){editingId=null;return alert('訂正する記録が見つかりません。')}records[ix]={...records[ix],...r};}else records.unshift(r);save();clearForm();renderMy();tab('my');alert(wasEditing?'記録を訂正しました':'記録を保存しました');editingId=null;document.getElementById('saveButton').textContent='記録を保存'}
function editRecord(id){const r=records.find(x=>x.id===id&&String(x.employee)===String(employee));if(!r)return alert('記録が見つかりません');editingId=id;document.getElementById('date').value=r.date||localDate();fields.forEach(k=>document.getElementById(k).value=Number(r[k])||0);document.getElementById('saveButton').textContent='訂正内容を保存';tab('input');validateForm();window.scrollTo({top:0,behavior:'smooth'})}
function clearForm(){editingId=null;fields.forEach(k=>document.getElementById(k).value='');document.getElementById('date').value=localDate();document.getElementById('saveButton').textContent='記録を保存';validateForm()}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(records))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(k,v){const n=Number(v)||0;return k==='supplyAmount'?n.toLocaleString('ja-JP')+'円':n.toLocaleString('ja-JP')}
function renderMy(){const rs=records.filter(r=>String(r.employee)===String(employee));document.getElementById('mySummary').innerHTML=fields.map(k=>`<div class="metric">${labels[k]} 合計<strong>${fmt(k,rs.reduce((a,r)=>a+(Number(r[k])||0),0))}</strong></div>`).join('');document.getElementById('myRows').innerHTML=rs.map(r=>{const errs=getErrors(r);return `<tr><td>${esc(r.date||'')}</td>${fields.map(k=>`<td>${fmt(k,r[k])}</td>`).join('')}<td class="error-cell">${errs.length?'<ul>'+errs.map(x=>'<li>'+esc(x.message)+'</li>').join('')+'</ul>':'<span class="oktext">エラーなし</span>'}</td><td><button class="editbtn" onclick="editRecord('${esc(r.id)}')">訂正</button><button class="danger" onclick="deleteRecord('${esc(r.id)}')">削除</button></td></tr>`}).join('');document.getElementById('myEmpty').classList.toggle('hidden',rs.length>0)}
function deleteRecord(id){const ix=records.findIndex(r=>r.id===id&&String(r.employee)===String(employee));if(ix<0)return;if(confirm('この記録を削除しますか？')){records.splice(ix,1);save();renderMy()}}
fields.forEach(k=>document.getElementById(k).addEventListener('input',validateForm));
document.getElementById('date').addEventListener('change',validateForm);
if(sessionStorage.getItem('wfmEmployee')){employee=sessionStorage.getItem('wfmEmployee');start()}else{save()}
</script></body></html>
