<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172033"><title>トラックメモ</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="トラックメモ">
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;margin:0;background:#f3f5f8;color:#202938}header{background:#172033;color:white;padding:16px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left));position:sticky;top:0;z-index:2;box-shadow:0 2px 8px #0002}header h1{font-size:21px;margin:0 0 5px}header .sub{font-size:12px;color:#cbd5e1}main{max-width:900px;margin:16px auto;padding:0 12px 30px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0000000b}.login{max-width:420px;margin:60px auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;font-size:13px;font-weight:700}input{display:block;width:100%;padding:12px;margin-top:6px;border:1px solid #cbd2de;border-radius:9px;font-size:16px;background:#fff;color:#202938}button{padding:12px 14px;border:0;border-radius:9px;background:#315efb;color:white;font-weight:700;font-size:15px;margin:5px 5px 0 0;cursor:pointer}.secondary{background:#e5e9f0;color:#263244}.danger{background:#fee2e2;color:#991b1b}.hidden{display:none!important}.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1;margin:0}.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric{background:#f5f7fa;padding:12px;border-radius:9px;font-size:12px;color:#586174}.metric strong{display:block;font-size:22px;color:#172033;margin-top:5px;overflow-wrap:anywhere}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px;font-size:12px}td,th{padding:9px;border-bottom:1px solid #e4e7ec;white-space:nowrap;text-align:right}td:first-child,th:first-child{text-align:left}th{background:#f5f6f8}.note{font-size:12px;color:#667085;line-height:1.6}.badge{background:#e8efff;color:#315efb;padding:4px 8px;border-radius:20px;font-size:12px}.section-title{margin:0 0 14px;font-size:18px}.form-actions{display:flex;flex-wrap:wrap;margin-top:14px}.amount input{font-variant-numeric:tabular-nums}@media(min-width:650px){.summary{grid-template-columns:repeat(4,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:360px){.grid{grid-template-columns:1fr}header h1{font-size:19px}}
</style>
<script>if('serviceWorker'in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(e=>console.log('SW registration failed',e)));}</script>
</head><body>
<div id="login" class="card login"><h1 style="text-align:center">トラックメモ</h1><p>社員番号を入力してログイン</p><label>社員番号<input id="empId" inputmode="numeric" placeholder="例：10001" onkeydown="if(event.key==='Enter')loginUser()"></label><button style="width:100%;margin-top:15px" onclick="loginUser()">ログイン</button><p class="note">※社員番号による簡易ログインです。</p></div>
<div id="app" class="hidden"><header><button style="float:right;background:#374151;padding:8px 10px;margin:0" onclick="logout()">ログアウト</button><h1>トラックメモ</h1><div id="user" class="sub"></div></header><main><div class="tabs"><button onclick="tab('my')">記録一覧</button><button onclick="tab('input')">＋ 実績入力</button></div>
<section id="input" class="card hidden"><h2 class="section-title">配送実績入力</h2><div class="grid"><label>日付<input id="date" type="date" required></label><label>配送件数<input id="deliveryCount" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label><label>個配件数<input id="kohaCount" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label><label>ペア個配件数<input id="pairKohaCount" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label><label>実配件数<input id="actualCount" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label><label>新規件数<input id="newCount" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label><label>班件数<input id="teamCount" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label><label>班配布枚数<input id="teamSheets" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label><label class="amount">供給金額（円）<input id="supplyAmount" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label></div><div class="form-actions"><button onclick="addRecord()">記録を保存</button><button class="secondary" onclick="clearForm()">入力をクリア</button></div></section>
<section id="my" class="card"><h2 class="section-title">記録一覧</h2><div id="mySummary" class="summary"></div><div class="tablewrap" style="margin-top:14px"><table><thead><tr><th>日付</th><th>配送件数</th><th>個配件数</th><th>ペア個配件数</th><th>実配件数</th><th>新規件数</th><th>班件数</th><th>班配布枚数</th><th>供給金額</th><th>操作</th></tr></thead><tbody id="myRows"></tbody></table></div><p id="myEmpty" class="note">まだ記録がありません。</p></section>
</main></div>
<script>
const STORAGE_KEY='deliveryWfmRecords';
const fields=['deliveryCount','kohaCount','pairKohaCount','actualCount','newCount','teamCount','teamSheets','supplyAmount'];
const labels={deliveryCount:'配送件数',kohaCount:'個配件数',pairKohaCount:'ペア個配件数',actualCount:'実配件数',newCount:'新規件数',teamCount:'班件数',teamSheets:'班配布枚数',supplyAmount:'供給金額'};
let records=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'),employee='';
function loginUser(){employee=document.getElementById('empId').value.trim();if(!employee)return alert('社員番号を入力してください');sessionStorage.setItem('wfmEmployee',employee);start()}
function start(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('user').innerHTML='ログイン中：<span class="badge">社員番号 '+esc(employee)+'</span>';document.getElementById('date').value=localDate();tab('my')}
function logout(){sessionStorage.removeItem('wfmEmployee');location.reload()}
function tab(t){['input','my'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==t));if(t==='my')renderMy()}
function localDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function num(id){return Math.max(0,Number(document.getElementById(id).value)||0)}
function addRecord(){const date=document.getElementById('date').value;if(!date)return alert('日付を入力してください');const r={employee,date,createdAt:new Date().toISOString()};fields.forEach(k=>r[k]=num(k));records.unshift(r);save();clearForm();renderMy();tab('my');alert('記録を保存しました')}
function clearForm(){fields.forEach(k=>document.getElementById(k).value='');document.getElementById('date').value=localDate()}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(records))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(k,v){const n=Number(v)||0;return k==='supplyAmount'?n.toLocaleString('ja-JP')+'円':n.toLocaleString('ja-JP')}
function renderMy(){const rs=records.filter(r=>String(r.employee)===String(employee));document.getElementById('mySummary').innerHTML=fields.map(k=>`<div class="metric">${labels[k]} 合計<strong>${fmt(k,rs.reduce((a,r)=>a+(Number(r[k])||0),0))}</strong></div>`).join('');document.getElementById('myRows').innerHTML=rs.map((r,i)=>`<tr><td>${esc(r.date||'')}</td>${fields.map(k=>`<td>${fmt(k,r[k])}</td>`).join('')}<td><button class="danger" onclick="deleteRecord(${i})">削除</button></td></tr>`).join('');document.getElementById('myEmpty').classList.toggle('hidden',rs.length>0)}
function deleteRecord(i){const rs=records.filter(r=>String(r.employee)===String(employee));const ix=records.indexOf(rs[i]);if(ix<0)return;if(confirm('この記録を削除しますか？')){records.splice(ix,1);save();renderMy()}}
if(sessionStorage.getItem('wfmEmployee')){employee=sessionStorage.getItem('wfmEmployee');start()}
</script></body></html>
