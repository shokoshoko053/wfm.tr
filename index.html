<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>トラックメモ</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;background:#f3f5f8;color:#202938}header{background:#172033;color:white;padding:18px}main{max-width:1200px;margin:20px auto;padding:0 14px}.card{background:white;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 12px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}label{display:block;font-size:13px;font-weight:650}input{display:block;width:100%;padding:10px;margin-top:5px;border:1px solid #ccd2dc;border-radius:8px;font-size:16px}button{padding:10px 14px;border:0;border-radius:8px;background:#315efb;color:white;font-weight:700;margin:5px 5px 0 0;cursor:pointer}.secondary{background:#e5e9f0;color:#263244}.danger{background:#fee2e2;color:#991b1b}.hidden{display:none!important}.login{max-width:420px;margin:60px auto}.tabs{margin:12px 0}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.metric{background:#f5f7fa;padding:12px;border-radius:8px}.metric strong{display:block;font-size:20px;margin-top:4px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1100px;font-size:12px}td,th{padding:8px;border-bottom:1px solid #e4e7ec;white-space:nowrap;text-align:right}td:first-child,th:first-child{text-align:left}th{background:#f5f6f8}.note{font-size:12px;color:#667085}.badge{background:#e8efff;color:#315efb;padding:4px 8px;border-radius:20px;font-size:12px}@media(max-width:600px){header h1{font-size:20px}}</style><meta name="theme-color" content="#172033">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="トラックメモ">
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(err => console.log('Service worker registration failed:', err)));
}
</script>
</head><body>
<div id="login" class="card login"><h1 style="text-align:center">配送WFM</h1><p>社員番号でログイン</p><div id="empLogin"><label>社員番号<input id="empId" placeholder="例：10001" onkeydown="if(event.key==='Enter')loginUser()"></label></div><button style="width:100%;margin-top:15px" onclick="loginUser()">ログイン</button><p class="note">社員番号を入力してログインしてください。</p></div>
<div id="app" class="hidden"><header><button style="float:right;background:#374151" onclick="logout()">ログアウト</button><h1>配送WFM 統合版</h1><div id="user"></div></header><main><div class="tabs"><button onclick="tab('my')">自分の実績</button><button id="inputBtn" onclick="tab('input')">実績入力</button></div>
<section id="input" class="card hidden"><h2>配送実績入力</h2><div class="grid"><label>社員番号<input id="employee" readonly></label><label>日付<input id="date" type="date"></label><label>ドライバー<input id="driver" placeholder="田中"></label><label>車両<input id="vehicle" placeholder="1234"></label><label>コース<input id="course" placeholder="Aコース"></label><label>センター出発の距離(km)<input id="startKm" type="number" step="0.1"></label><label>配送1件目の距離(km)<input id="firstKm" type="number" step="0.1"></label><label>最終納品先の距離(km)<input id="lastKm" type="number" step="0.1"></label><label>センター到着の距離(km)<input id="returnKm" type="number" step="0.1"></label><label>配送件数<input id="planned" type="number"></label><label>実配件数<input id="actual" type="number"></label><label>個配ポイント<input id="koha" type="number" step="0.1"></label><label>ペア個配ポイント<input id="pair" type="number" step="0.1"></label><label>共同ポイント<input id="joint" type="number" step="0.1"></label><label>班配布件数<input id="team" type="number"></label><label>休憩時間(分)<input id="breakMin" type="number"></label></div><button onclick="add()">実績を登録</button><button class="secondary" onclick="clearForm()">クリア</button></section>
<section id="my" class="card"><h2>自分の実績</h2><div id="mySummary" class="summary"></div><div class="tablewrap"><table><thead><tr><th>日付</th><th>社員番号</th><th>ドライバー</th><th>車両</th><th>コース</th><th>出発</th><th>1件目</th><th>最終</th><th>帰着</th><th>総距離</th><th>配送</th><th>実配</th><th>個配</th><th>ペア</th><th>共同</th><th>班配布</th><th>休憩</th><th></th></tr></thead><tbody id="myRows"></tbody></table></div><p id="myEmpty">まだ実績がありません。</p></section>
</main></div>
<script>
let records=JSON.parse(localStorage.getItem('deliveryWfmRecords')||'[]'),role='',employee='';const fields=['date','driver','vehicle','course','startKm','firstKm','lastKm','returnKm','planned','actual','koha','pair','joint','team','breakMin'];function loginUser(){employee=document.getElementById('empId').value.trim();if(!employee)return alert('社員番号を入力してください');role='employee';sessionStorage.setItem('wfmRole',role);sessionStorage.setItem('wfmEmployee',employee);start()}function start(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('user').innerHTML='ログイン中：<span class="badge">社員番号 '+esc(employee)+'</span>';document.getElementById('inputBtn').classList.remove('hidden');document.getElementById('employee').value=employee;document.getElementById('date').value=new Date().toLocaleDateString('sv-SE');tab('my')}function logout(){sessionStorage.clear();location.reload()}function tab(t){['input','my'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==t));if(t==='my')renderMy()}function val(id){return Number(document.getElementById(id).value)||0}function add(){if(role!=='employee')return;if(!document.getElementById('date').value||!document.getElementById('driver').value.trim())return alert('日付とドライバーを入力してください');let r={employee,...Object.fromEntries(fields.map(k=>[k,['date','driver','vehicle','course'].includes(k)?document.getElementById(k).value.trim():val(k)]))};records.unshift(r);save();clearForm();renderMy();alert('登録しました')}function clearForm(){fields.slice(1).forEach(k=>document.getElementById(k).value='');document.getElementById('employee').value=employee;document.getElementById('date').value=new Date().toLocaleDateString('sv-SE')}function save(){localStorage.setItem('deliveryWfmRecords',JSON.stringify(records))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function km(r){return ['startKm','firstKm','lastKm','returnKm'].reduce((a,k)=>a+(+r[k]||0),0)}function pts(r){return (+r.koha||0)+(+r.pair||0)+(+r.joint||0)}function summary(rs){let t={planned:0,actual:0,km:0,pts:0,br:0};rs.forEach(r=>{t.planned+=+r.planned||0;t.actual+=+r.actual||0;t.km+=km(r);t.pts+=pts(r);t.br+=+r.breakMin||0});return `<div class="metric">配送件数<strong>${t.planned}</strong></div><div class="metric">実配件数<strong>${t.actual}</strong></div><div class="metric">総距離<strong>${t.km.toFixed(1)} km</strong></div><div class="metric">総ポイント<strong>${t.pts.toFixed(1)}</strong></div><div class="metric">休憩時間<strong>${t.br}分</strong></div>`}function row(r,btn){return `<td>${esc(r.date)}</td><td>${esc(r.employee)}</td><td>${esc(r.driver)}</td><td>${esc(r.vehicle)}</td><td>${esc(r.course)}</td><td>${+r.startKm||0}</td><td>${+r.firstKm||0}</td><td>${+r.lastKm||0}</td><td>${+r.returnKm||0}</td><td><b>${km(r).toFixed(1)}</b></td><td>${+r.planned||0}</td><td>${+r.actual||0}</td><td>${+r.koha||0}</td><td>${+r.pair||0}</td><td>${+r.joint||0}</td><td>${+r.team||0}</td><td>${+r.breakMin||0}分</td><td>${btn}</td>`}function renderMy(){let rs=records.filter(r=>r.employee===employee);document.getElementById('mySummary').innerHTML=summary(rs);document.getElementById('myRows').innerHTML=rs.map((r,i)=>`<tr>${row(r,`<button class="danger" onclick="delOwn(${i})">削除</button>`)}</tr>`).join('');document.getElementById('myEmpty').classList.toggle('hidden',rs.length>0)}function delOwn(i){let rs=records.filter(r=>r.employee===employee),ix=records.indexOf(rs[i]);if(confirm('この実績を削除しますか？')){records.splice(ix,1);save();renderMy()}}if(sessionStorage.getItem('wfmEmployee')){role='employee';employee=sessionStorage.getItem('wfmEmployee');start()}
</script></body></html>
